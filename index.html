<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my grid</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 8px;
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        font-size: 14px;
    }

    .container {
        display: grid;
        grid-template-columns: 55px 1fr 120px 120px 120px;
        border: 1px solid #d6dbe1;
        background: white;
        border-radius: 6px;
        overflow: hidden;
    }

    .item {
        padding: 4px 6px;
        border-bottom: 1px solid #e5e9ef;
        border-right: 1px solid #e5e9ef;
        display: flex;
        align-items: center;
        min-height: 32px;
        font-size: 14px;
    }

    .header {
        background: #2f5d8c;
        color: white;
        font-weight: bold;
        justify-content: center;
        min-height: 34px;
    }

    .cod {
        justify-content: center;
        font-weight: bold;
        background: #fafafa;
    }

    .descriere {
        font-weight: 500;
    }

    .numeric {
        justify-content: center;
    }

    input[type="number"] {
        width: 100%;
        height: 24px;
        padding: 2px 4px;
        border: 1px solid #c8d0da;
        border-radius: 2px;
        font-size: 14px;
        text-align: right;
        background: #fcfcfc;
        user-select: text;
    }

    input[type="number"]:focus {
        outline: none;
        border-color: #2f5d8c;
        background: white;
        box-shadow: 0 0 0 1px rgba(47,93,140,0.15);
    }
    .modified {
        font-weight: bold;
    }
</style>
</head>
<body>
    <div class="container" id="container"></div>
    <button id="saveBtn" class="btn btn-primary mt-3">Save</button>
    <script>

        async function getData() {
            const url = "data/capitol_2a.json";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                return result = await response.json();
                
            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        

    async function setHtml() {
        let data = await getData();   
        let html = "";
        data.forEach(item => {
            //console.log(item.cod_parinte);
            
            html += `
                
                    <div class="item" data-row="row${item.cod}" data-column="cod">${item.cod}</div>
                    <div class="item" data-row="row${item.cod}" data-column="descriere">${item.descriere} ${item.formula}</div>
                    <div class="item">
                        <input type="number" data-row="row${item.cod}" data-column="inloc" data-parent="${item.cod_parinte}" data-sign="${item.semn}"  id="inloc${item.cod}" value="${item.in_localitate || 0}" />    
                    </div>
                    <div class="item">
                        <input type="number" data-row="row${item.cod}" data-column="altloc" data-parent="${item.cod_parinte}" data-sign="${item.semn}" id="altloc${item.cod}" value="${item.alta_localitate || 0}" />
                    </div>
                    <div class="item">
                        <input type="number" data-row="row${item.cod}" data-column="total" data-parent="${item.cod_parinte}" data-sign="${item.semn}" id="total${item.cod}" value="${item.total || 0}" />
                    </div>
            `;
        });
        document.getElementById("container").innerHTML = html;
        
        document.addEventListener("input", e => {
            if (!e.target.matches("input[data-column='inloc'], input[data-column='altloc']")) {
                return;
            }
             
            calculeazaRand(e.target.dataset.row);
            calculeazaParinte(e.target.dataset.parent);
        });
        document.addEventListener("click", e => {
            if (!e.target.matches("#saveBtn")) {
                return;
            }
            saveData();
        });  
    }
    function saveData() {
        const rows = [...new Set(
            [...document.querySelectorAll("input[data-row]")]
                .filter(input => parseFloat(input.value) !== 0)
                .map(input => input.dataset.row)
        )];
        
        const data = rows.map(row => {
            const rowInputs = document.querySelectorAll(
                `input[data-row="${row}"]`
            );
            const obj = { row };
            rowInputs.forEach(input => {
                obj[input.dataset.column] = input.value;
            });
            return obj;
        });

        console.log(JSON.stringify(data));
    }

    function calculeazaRand(row) {
        const inloc = document.querySelector(
            `input[data-row="${row}"][data-column="inloc"]`
        );
        const altloc = document.querySelector(
            `input[data-row="${row}"][data-column="altloc"]`
        );
        const total = document.querySelector(
            `input[data-row="${row}"][data-column="total"]`
        );
        total.value =
            ((parseFloat(inloc.value) || 0) +
            (parseFloat(altloc.value) || 0))
            .toFixed(4);
    }

    function calculeazaParinte(parent) {

        if (!parent || parent == 0) return;

        const copiiInloc = document.querySelectorAll(
            `input[data-column="inloc"][data-parent="${parent}"]`
        );

        const copiiAltloc = document.querySelectorAll(
            `input[data-column="altloc"][data-parent="${parent}"]`
        );

        let totalInloc = 0;
        let totalAltloc = 0;

        copiiInloc.forEach(item => {
            let val = parseFloat(item.value) || 0;
            totalInloc += item.dataset.sign === "-" ? -val : val;
        });

        copiiAltloc.forEach(item => {
            let val = parseFloat(item.value) || 0;
            totalAltloc += item.dataset.sign === "-" ? -val : val;
        });

        const parentInloc = document.querySelector(
            `input[data-row="row${parent}"][data-column="inloc"]`
        );

        const parentAltloc = document.querySelector(
            `input[data-row="row${parent}"][data-column="altloc"]`
        );

        const parentTotal = document.querySelector(
            `input[data-row="row${parent}"][data-column="total"]`
        );

        parentInloc.value = totalInloc.toFixed(4);
        parentAltloc.value = totalAltloc.toFixed(4);
        parentTotal.value = (totalInloc + totalAltloc).toFixed(4);

        // dacă părintele are și el părinte
        calculeazaParinte(parentInloc.dataset.parent);
    }
    
    function formatToFourDecimals(num) {
        num = String(num);
        let match = num.match(/^\d+\.0*\d{0,4}/);
        if (match) {
            return match[0];
        }
        return num;
    }

        async function main(){
            await setHtml(await getData());
        }
        main();
        
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
